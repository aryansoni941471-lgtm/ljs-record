<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Diamond Icon Core -->
  <g transform="translate(0, -15)">
    <!-- Outer Diamond Contour -->
    <path d="M256 120 L380 210 L256 360 L132 210 Z" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#goldGlow)" />
    
    <!-- Facet Lines -->
    <path d="M190 210 L256 360 L322 210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    <path d="M190 210 L256 120 L322 210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    <path d="M132 210 L380 210" fill="none" stroke="url(#goldGrad)" stroke-width="10" />
    
    <!-- Upper facets -->
    <path d="M200 120 L190 210" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
    <path d="M312 120 L322 210" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
    
    <!-- Central Jewel Glow -->
    <circle cx="256" cy="235" r="18" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  </g>

  <!-- Branding Text -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', 'Cinzel', Arial, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">LJS JEWELLERS</text>
  <text x="256" y="455" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="19" fill="#94a3b8" text-anchor="middle" letter-spacing="3">CUSTOMER KHATA</text>
</svg>
